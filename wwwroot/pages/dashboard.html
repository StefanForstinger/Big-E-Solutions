<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projektplaner – Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    /* UI & Layout */
    .role-badge { display:inline-block; padding:2px 10px; border-radius:20px; font-size:.76em; font-weight:700; letter-spacing:.02em; }
    .role-admin   { background:#fee2e2; color:#b91c1c; }
    .role-teacher { background:#fef3c7; color:#92400e; }
    .role-student { background:#dbeafe; color:#1e40af; }

    /* ── Navbar-Buttons: sichtbar auf dunkelblauem Hintergrund ─────────────── */
    .btn-nav {
      display: inline-flex; align-items: center; gap: .35rem;
      padding: .38rem .85rem; border-radius: 6px;
      font-size: .85rem; font-weight: 600; cursor: pointer;
      text-decoration: none; white-space: nowrap;
      background: rgba(255,255,255,.18);
      color: var(--white);
      border: 1.5px solid rgba(255,255,255,.55);
      opacity: 1;
      transition: background .2s, border-color .2s, box-shadow .2s;
    }
    .btn-nav:hover {
      background: rgba(255,255,255,.30);
      border-color: rgba(255,255,255,.85);
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
      color: var(--white);
    }
    .btn-nav .nav-icon { font-size: 1rem; line-height: 1; opacity: 1; }

    /* ── Projekt-Karte: Delete-Button ──────────────────────────────────────── */
    .btn-card-delete {
      position: absolute; top: .85rem; right: .85rem;
      background: var(--gray-100); color: var(--gray-600);
      border: 1.5px solid var(--gray-300);
      border-radius: 6px; padding: 3px 8px;
      font-size: .82rem; font-weight: 700; cursor: pointer;
      opacity: 1;
      transition: background .15s, color .15s, border-color .15s, box-shadow .15s;
      z-index: 10;
    }
    .btn-card-delete:hover {
      background: var(--red); color: var(--white);
      border-color: var(--red);
      box-shadow: 0 2px 8px rgba(231,76,60,.35);
    }

    /* ── Edit / Export Buttons in Karte ────────────────────────────────────── */
    .project-card .btn-ghost { opacity: 1; color: var(--navy); }
    .project-card .btn-ghost:hover { background: var(--gray-200); color: var(--navy); }

    .panel-section { margin-bottom:2rem; }
    .panel-section-title { display:flex; align-items:center; justify-content:space-between; margin-bottom:.9rem; }
    .panel-section-title h2 { font-size:1rem; color:var(--navy); }
    .panel-toggle { font-size:.8rem; color:var(--gray-600); cursor:pointer; background:none; border:none; padding:2px 8px; border-radius:4px; }
    .panel-toggle:hover { background:var(--gray-200); }
    .panel-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:1.2rem; }
    .panel-grid > * { min-width: 0; }

    /* Modals */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
    .modal-overlay.open { display: flex; }
    .alert-hidden { display: none; }

    /* Cards */
    .admin-card, .assign-card { background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); border-left:4px solid var(--red); overflow:hidden; transition:box-shadow var(--trans),transform var(--trans); }
    .assign-card { border-left-color: var(--green); padding: 1.2rem; display: flex; flex-direction: column; gap: .5rem; }
    .admin-card:hover, .assign-card:hover { box-shadow:var(--shadow-lg); transform:translateY(-2px); }

    .admin-card-header { display:flex; align-items:center; justify-content:space-between; padding:.9rem 1.1rem .6rem; }
    .admin-card-header h3 { font-size:.95rem; color:var(--navy); }
    .admin-card-body { padding:0 1.1rem .8rem; }
    .admin-card-row { font-size:.83rem; color:var(--gray-600); margin-bottom:.2rem; }
    .admin-card-row span { color:var(--gray-800); font-weight:500; }
    .admin-card-footer { padding:.7rem 1.1rem; border-top:1px solid var(--gray-200); display:flex; align-items:center; gap:.5rem; }
    .admin-card-footer label { font-size:.8rem; font-weight:600; color:var(--gray-600); white-space:nowrap; }
    .admin-card-footer select { flex:1; padding:4px 8px; border-radius:6px; border:1.5px solid var(--gray-400); font-size:.85rem; }

    .chip-list { display:flex; flex-wrap:wrap; gap:.35rem; min-height:26px; }
    .chip { display:inline-flex; align-items:center; gap:.3rem; background:#dbeafe; color:#1e40af; border-radius:20px; padding:2px 8px 2px 10px; font-size:.78rem; font-weight:600; }
    .chip-btn { background:none; border:none; cursor:pointer; color:#3b82f6; font-size:.85rem; line-height:1; padding:0 1px; }
    .chip-btn:hover { color:#b91c1c; }
    .assign-add { display:flex; gap:.5rem; align-items:center; margin-top:.2rem; border-top:1px solid var(--gray-200); padding-top:.75rem; }
    .btn-add-student { padding:.38rem .85rem; background:var(--green); color:var(--white); border:none; border-radius:6px; font-size:.82rem; font-weight:700; cursor:pointer; }

    .progress-bar-wrap { background:var(--gray-200); border-radius:20px; height:6px; overflow:hidden; margin-top:.3rem; }
    .progress-bar-fill { height:100%; border-radius:20px; transition:width .4s ease; }

    .color-swatches { display:flex; gap:.5rem; flex-wrap:wrap; margin-top:.35rem; }
    .swatch { width:28px; height:28px; border-radius:50%; cursor:pointer; border:3px solid transparent; transition:border-color .15s,transform .15s; }
    .swatch.selected { border-color:var(--navy); }

    .page-wrapper { padding-bottom: 5rem; }
    .auth-footer { position: fixed; bottom: 0; left: 0; right: 0; text-align: center; padding: .75rem 1rem; font-size: .8rem; color: rgba(255,255,255,.45); background: #1E3A5F; z-index: 100; }
    .auth-footer a { color: rgba(255,255,255,.65); text-decoration: none; font-weight: 600; }
    .auth-footer .sep { margin: 0 .5rem; opacity: .4; }
  </style>
</head>
<body>
<nav class="navbar">
  <a href="/pages/dashboard.html" class="navbar-brand"><span class="icon">🗓</span> Projektplaner</a>
  <div class="navbar-right">
    <div id="admin-nav-link" style="display:none; gap:.4rem; margin-right:.75rem; align-items:center;">
      <a href="/pages/user-management.html" class="btn-nav">
        <span class="nav-icon">👥</span> Benutzer
      </a>
      <a href="/pages/work-schedule.html" class="btn-nav">
        <span class="nav-icon">⏱</span> Arbeitszeit
      </a>
    </div>
    <span class="navbar-user" id="nav-user"></span>
    <span class="role-badge" id="nav-role"></span>
    <button class="btn btn-white btn-sm" onclick="logout()">Abmelden</button>
  </div>
</nav>

<div class="page-wrapper">
  <div id="admin-panel" class="panel-section" style="display:none">
    <div class="panel-section-title">
      <h2>👑 Benutzerverwaltung</h2>
      <button class="panel-toggle" onclick="toggleSection('admin-grid')">Ein-/Ausblenden</button>
    </div>
    <div id="admin-grid" class="panel-grid"></div>
  </div>

  <div id="teacher-panel" class="panel-section" style="display:none">
    <div class="panel-section-title">
      <h2>🎓 Schüler zu Projekten zuweisen</h2>
      <button class="panel-toggle" onclick="toggleSection('assign-grid')">Ein-/Ausblenden</button>
    </div>
    <div id="assign-grid" class="panel-grid"></div>
  </div>

  <div class="page-header">
    <div>
      <h1 id="page-title">Meine Projekte</h1>
      <p class="text-muted mt-1" id="page-sub">Verwalte deine Projekte und Aufgaben</p>
    </div>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;">
      <button class="btn btn-ghost btn-sm" onclick="exportAllExcel()">Alle Excel</button>
      <button class="btn btn-ghost btn-sm" onclick="exportAllPdf()">Alle PDF</button>
      <button id="btn-new-project" class="btn btn-primary" onclick="openModal('modal-new-project')">+ Neues Projekt</button>
    </div>
  </div>
  <div id="project-grid" class="project-grid"></div>
</div>

<div id="modal-new-project" class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h2>Neues Projekt erstellen</h2>
      <button class="modal-close" onclick="closeModal('modal-new-project')">✕</button>
    </div>
    <div class="form-group">
      <label for="p-name">Projektname *</label>
      <input id="p-name" type="text">
    </div>
    <div class="form-group">
      <label for="p-desc">Beschreibung</label>
      <textarea id="p-desc"></textarea>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Startdatum *</label><input id="p-start" type="date"></div>
      <div class="form-group"><label>Enddatum *</label><input id="p-end" type="date"></div>
    </div>
    <div class="form-group">
      <label>Projektfarbe</label>
      <div class="color-swatches" id="new-swatches"></div>
      <input type="hidden" id="p-color" value="#2D9CDB">
    </div>
    <div id="msg-new-project" class="alert alert-hidden"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-new-project')">Abbrechen</button>
      <button id="btn-create" class="btn btn-primary" onclick="createProject()">Erstellen</button>
    </div>
  </div>
</div>

<div id="modal-edit-project" class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h2>Projekt bearbeiten</h2>
      <button class="modal-close" onclick="closeModal('modal-edit-project')">✕</button>
    </div>
    <input type="hidden" id="edit-id">
    <div class="form-group"><label>Projektname *</label><input id="edit-name" type="text"></div>
    <div class="form-group"><label>Beschreibung</label><textarea id="edit-desc"></textarea></div>
    <div class="form-row">
      <div class="form-group"><label>Startdatum *</label><input id="edit-start" type="date"></div>
      <div class="form-group"><label>Enddatum *</label><input id="edit-end" type="date"></div>
    </div>
    <div class="form-group">
      <label>Projektfarbe</label>
      <div class="color-swatches" id="edit-swatches"></div>
      <input type="hidden" id="edit-color" value="#2D9CDB">
    </div>
    <div id="msg-edit-project" class="alert alert-hidden"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-edit-project')">Abbrechen</button>
      <button id="btn-save-edit" class="btn btn-primary" onclick="saveEdit()">Speichern</button>
    </div>
  </div>
</div>

<footer class="auth-footer">
  © 2025 Projektplaner · <a href="/pages/impressum.html">Impressum</a> · <a href="/pages/datenschutz.html">Datenschutz</a>
</footer>

<script src="/js/api.js"></script>
<script>
  /* --- Logic & Auth --- */
  if (!isLoggedIn()) window.location.href = '/index.html';
  const currentRole = getUserRole();
  const currentUser = getUser();
  let allStudents = [];
  let allProjects = [];

  document.getElementById('nav-user').textContent = getUserName();
  const roleEl = document.getElementById('nav-role');
  roleEl.textContent = currentRole;
  roleEl.className = 'role-badge role-' + currentRole.toLowerCase();

  const elBtnNew     = document.getElementById('btn-new-project');
  const elAdminPanel = document.getElementById('admin-panel');
  const elNavLink    = document.getElementById('admin-nav-link');
  const elTeacher    = document.getElementById('teacher-panel');

  if (currentRole === 'Teacher' && elBtnNew)     elBtnNew.style.display = 'none';
  if (currentRole === 'Admin') {
    if (elAdminPanel) elAdminPanel.style.display = 'block';
    if (elNavLink)    elNavLink.style.display    = 'flex';
    loadAdminPanel();
  }
  if (currentRole === 'Teacher' || currentRole === 'Admin') {
    if (elTeacher) elTeacher.style.display = 'block';
    loadTeacherPanel();
  }

  const PROJECT_COLORS = ['#2D9CDB','#27AE60','#E74C3C','#F39C12','#8E44AD','#1E3A5F','#16A085','#D35400'];

  function buildSwatches(containerId, hiddenId, selectedColor) {
    const norm = (selectedColor || '#2D9CDB').toUpperCase();
    const cont = document.getElementById(containerId);
    cont.innerHTML = PROJECT_COLORS.map(c => `
        <div class="swatch ${c.toUpperCase() === norm ? 'selected' : ''}"
             style="background:${c}" data-color="${c}"
             onclick="selectColor('${containerId}','${hiddenId}','${c}')"></div>
      `).join('');
    document.getElementById(hiddenId).value = selectedColor || '#2D9CDB';
  }

  function selectColor(containerId, hiddenId, color) {
    document.getElementById(hiddenId).value = color;
    document.getElementById(containerId).querySelectorAll('.swatch')
            .forEach(s => s.classList.toggle('selected', s.dataset.color === color));
  }
  buildSwatches('new-swatches', 'p-color', '#2D9CDB');
  buildSwatches('edit-swatches', 'edit-color', '#2D9CDB');

  /* --- Data Loading --- */
  async function loadAdminPanel() {
    const grid = document.getElementById('admin-grid');
    try {
      const res = await apiFetch('/auth/getAll');
      const users = await res.json();
      grid.innerHTML = users.map(u => `
          <div class="admin-card">
            <div class="admin-card-header"><h3>${esc(u.fullName)}</h3><span class="role-badge role-${u.role.toLowerCase()}">${esc(u.role)}</span></div>
            <div class="admin-card-body"><div class="admin-card-row">✉️ <span>${esc(u.email)}</span></div></div>
            <div class="admin-card-footer">
              <label>Rolle:</label>
              <select onchange="changeRole('${u.id}', this)" ${u.id === currentUser?.nameid || u.role === 'Admin' ? 'disabled' : ''}>
                <option value="Student" ${u.role==='Student'?'selected':''}>Student</option>
                <option value="Teacher" ${u.role==='Teacher'?'selected':''}>Teacher</option>
                <option value="Admin" ${u.role==='Admin'?'selected':''}>Admin</option>
              </select>
            </div>
          </div>`).join('');
    } catch { grid.innerHTML = '<p>Fehler.</p>'; }
  }

  async function loadTeacherPanel() {
    const grid = document.getElementById('assign-grid');
    try {
      const [projRes, userRes] = await Promise.all([apiFetch('/project'), apiFetch('/auth/getAll')]);
      allProjects = await projRes.json();
      allStudents = (await userRes.json()).filter(u => u.role === 'Student');
      renderAssignGrid();
    } catch { grid.innerHTML = '<p>Fehler.</p>'; }
  }

  function renderAssignGrid() {
    const grid = document.getElementById('assign-grid');
    grid.innerHTML = allProjects.map(p => {
      const members = p.members ?? [];
      const assignedIds = new Set(members.map(m => m.userId));
      const available = allStudents.filter(s => !assignedIds.has(s.id));
      const chips = members.map(m => `<span class="chip">👤 ${esc(m.fullName)}<button class="chip-btn" onclick="removeMember(${p.id},'${m.userId}')">✕</button></span>`).join('') || '<span class="chip-empty">Leer</span>';
      const opts = available.map(s => `<option value="${s.id}">${esc(s.fullName)}</option>`).join('') || '<option disabled>Alle zugewiesen</option>';
      return `
          <div class="assign-card">
            <div class="assign-card-header"><h3>${esc(p.name)}</h3></div>
            <div class="chip-list">${chips}</div>
            <div class="assign-add">
              <select id="sel-${p.id}"><option value="">— Wählen —</option>${opts}</select>
              <button class="btn-add-student" onclick="addMember(${p.id})">+ Add</button>
            </div>
          </div>`;
    }).join('');
  }

  async function loadProjects() {
    try {
      const res = await apiFetch('/project');
      allProjects = await res.json();
      renderProjects(allProjects);
    } catch { document.getElementById('project-grid').innerHTML = '<p>Fehler.</p>'; }
  }

  function renderProjects(projects) {
    const grid = document.getElementById('project-grid');
    grid.innerHTML = projects.map(p => {
      const start = p.startDate?.slice(0,10) ?? '';
      const end = p.endDate?.slice(0,10) ?? '';
      const canManage = (p.ownerId === currentUser?.nameid || currentRole === 'Admin');

      return `
      <div class="project-card" id="proj-${p.id}" 
           style="border-left: 4px solid ${p.color}; padding: 1.2rem; position: relative;"
           data-id="${p.id}" data-name="${esc(p.name)}" data-desc="${esc(p.description ?? '')}" 
           data-start="${start}" data-end="${end}" data-color="${p.color}">
        
        ${canManage ? `
          <button class="btn-card-delete" onclick="deleteProject(${p.id})" title="Projekt löschen">
            🗑
          </button>` : ''}

        <div class="project-card-header" style="padding-right: 2.5rem;">
          <h3>${esc(p.name)}</h3>
        </div>
        
        <p class="project-desc">${esc(p.description) || '<em>Keine Beschreibung</em>'}</p>
        <p class="project-dates">📅 ${start} – ${end}</p>
        
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill" style="width:${p.progress ?? 0}%; background:${p.color}"></div>
        </div>

        <div class="project-actions">
          <button class="btn btn-primary btn-sm" onclick="openGantt(${p.id})">📊 Gantt</button>
          <button class="btn btn-ghost btn-sm" onclick="openCosts(${p.id})">💰 Kosten</button>
          <button class="btn btn-ghost btn-sm" onclick="exportProjectExcel(${p.id})">📊 XLS</button>
          <button class="btn btn-ghost btn-sm" onclick="exportProjectPdf(${p.id})">📄 PDF</button>
          ${canManage ? `<button class="btn btn-ghost btn-sm" onclick="openEdit(${p.id})">✏️ Edit</button>` : ''}
        </div>
      </div>`;
    }).join('');
  }

  /* --- Actions --- */
  async function addMember(projectId) {
    const sel = document.getElementById(`sel-${projectId}`);
    if(!sel.value) return;
    const res = await apiFetch(`/project/${projectId}/members`, { method:'POST', body: JSON.stringify({ userId: sel.value }) });
    if (res.ok) { loadTeacherPanel(); loadProjects(); }
  }

  async function removeMember(projectId, userId) {
    const res = await apiFetch(`/project/${projectId}/members/${userId}`, { method:'DELETE' });
    if (res.ok) { loadTeacherPanel(); loadProjects(); }
  }

  async function changeRole(userId, select) {
    const res = await apiFetch('/auth/setRole', { method:'PUT', body: JSON.stringify({ userId, role: select.value }) });
    if (res.ok) loadAdminPanel();
  }

  async function createProject() {
    const body = {
      name: document.getElementById('p-name').value,
      description: document.getElementById('p-desc').value,
      startDate: document.getElementById('p-start').value,
      endDate: document.getElementById('p-end').value,
      color: document.getElementById('p-color').value
    };
    const res = await apiFetch('/project', { method:'POST', body: JSON.stringify(body) });
    if (res.ok) { closeModal('modal-new-project'); loadProjects(); loadTeacherPanel(); }
  }

  async function saveEdit() {
    const id = document.getElementById('edit-id').value;
    const body = {
      name: document.getElementById('edit-name').value,
      description: document.getElementById('edit-desc').value,
      startDate: document.getElementById('edit-start').value,
      endDate: document.getElementById('edit-end').value,
      color: document.getElementById('edit-color').value
    };
    const res = await apiFetch(`/project/${id}`, { method:'PUT', body: JSON.stringify(body) });
    if (res.ok) { closeModal('modal-edit-project'); loadProjects(); }
  }

  async function deleteProject(id) {
    if(confirm("Projekt löschen?")) {
      await apiFetch(`/project/${id}`, { method:'DELETE' });
      loadProjects(); loadTeacherPanel();
    }
  }

  /* --- Export Helpers --- */
  async function downloadFile(url, filenameFallback) {
    try {
      const res = await fetch(url, {
        method: "GET",
        headers: {
          "Authorization": "Bearer " + getToken()
        }
      });

      if (!res.ok) {
        throw new Error(`Download failed (${res.status})`);
      }

      const blob = await res.blob();

      // Try to extract filename from header
      let filename = filenameFallback;
      const disposition = res.headers.get("Content-Disposition");
      if (disposition && disposition.includes("filename=")) {
        const match = disposition.match(/filename="?(.+?)"?$/);
        if (match) filename = match[1];
      }

      const urlBlob = window.URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = urlBlob;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();

      window.URL.revokeObjectURL(urlBlob);

    } catch (err) {
      console.error(err);
      alert("Export fehlgeschlagen.");
    }
  }
  function exportProjectExcel(id) {
    downloadFile(`/api/export/excel/${id}`, `project_${id}.xlsx`);
  }

  function exportProjectPdf(id) {
    downloadFile(`/api/export/pdf/${id}`, `project_${id}.pdf`);
  }
  function exportAllExcel() {
    downloadFile(`/api/export/excel`, `all_projects.xlsx`);
  }

  function exportAllPdf() {
    downloadFile(`/api/export/pdf`, `all_projects.pdf`);
  }

  /* --- Helpers --- */
  function openEdit(id) {
    const card = document.getElementById(`proj-${id}`);
    document.getElementById('edit-id').value = card.dataset.id;
    document.getElementById('edit-name').value = card.dataset.name;
    document.getElementById('edit-desc').value = card.dataset.desc;
    document.getElementById('edit-start').value = card.dataset.start;
    document.getElementById('edit-end').value = card.dataset.end;
    buildSwatches('edit-swatches', 'edit-color', card.dataset.color);
    openModal('modal-edit-project');
  }

  function logout() { localStorage.removeItem('token'); window.location.href = '/index.html'; }
  function esc(s) { let t = document.createElement('div'); t.textContent = s; return t.innerHTML; }
  function openModal(id) { document.getElementById(id).classList.add('open'); }
  function closeModal(id) { document.getElementById(id).classList.remove('open'); }
  function toggleSection(id) { const e = document.getElementById(id); e.style.display = (e.style.display==='none'?'grid':'none'); }
  function openGantt(id)  { window.location.href = `/pages/gantt.html?projectId=${id}`; }
  function openCosts(id)  { window.location.href = `/pages/costs.html?projectId=${id}`; }

  loadProjects();
</script>
</body>
</html>
